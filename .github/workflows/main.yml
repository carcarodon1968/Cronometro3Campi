name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Fix package.json versions & Build Web App
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "lucide-react": "latest"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.0",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.0",
              "tailwindcss": "^4.0.0",
              "typescript": "^5.7.0",
              "vite": "^6.0.0",
              "vite-plugin-pwa": "^0.21.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps
          npm run build

      - name: Build Installable Android APK
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf capacitor.config.* android
          npx cap init "CronoTri" "com.cronotri.app" --web-dir dist
          npx cap add android
          npx cap copy android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload CronoTri-Android-APK
        uses: actions/upload-artifact@v4
        with:
          name: CronoTri-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
